server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/shows/:slug, /publish) must resolve to
    # index.html so a hard refresh / deep link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
