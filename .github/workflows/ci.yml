name: CI

# Lint + test + build images on every push/PR. The deploy job is written and
# explained but gated so it never needs a real cloud in this exercise.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        # Non-blocking style pass: surface issues without failing the build on
        # formatting nits. Flip to a hard gate once the style baseline is agreed.
        run: ruff check app || true

      - name: Tests (pytest)
        working-directory: backend
        # The suite runs entirely on SQLite + a temp dir (see tests/conftest.py),
        # so no external Postgres service is needed here.
        run: pytest -q

  # ---------------------------------------------------------------- frontends
  frontends:
    name: Front-ends — typecheck & build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cms, viewer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_BASE: http://localhost:8000
        run: npm run build

  # ---------------------------------------------------------------- images
  images:
    name: Build & smoke-test images
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images via compose
        run: docker compose build

      - name: Smoke test — stack comes up and publishes
        run: |
          docker compose up -d
          echo "Waiting for the API to become healthy..."
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)
            echo "api health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "--- /health ---"
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status": *"ok"'
          echo "--- /catalog (expect published shows after demo bootstrap) ---"
          curl -fsS http://localhost:8000/catalog | tee /dev/stderr | grep -q '"sections"'
          echo "--- viewer served ---"
          curl -fsS http://localhost:5174/ | grep -qi '<div id="root">'
          echo "--- CMS served ---"
          curl -fsS http://localhost:5173/ | grep -qi '<div id="root">'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy (explained — no real cloud in this exercise)
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A real environment gates this with required reviewers + scoped secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Explain the deploy (dry run)
        # Pass the commit SHA in via env (quoted) rather than interpolating
        # ${{ }} directly into the shell — the safe pattern for workflow inputs.
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat <<PLAN
          =====================================================================
          DEPLOY STEP — what this would do with a real target
          =====================================================================
          This exercise has no cloud to deploy to, so this job documents the
          steps instead of running them. In production it would:

            1. Log in to the container registry (GHCR/ECR) using an OIDC token —
               no long-lived registry password stored in GitHub:
                 permissions: { id-token: write, packages: write }
            2. Build + push tagged, immutable images:
                 ghcr.io/<org>/peblo-api:${IMAGE_TAG}      (+ :latest)
                 ghcr.io/<org>/peblo-cms:${IMAGE_TAG}
                 ghcr.io/<org>/peblo-viewer:${IMAGE_TAG}
            3. Run DB migrations as a one-off release task BEFORE routing traffic
               to new pods:  alembic upgrade head  (backwards-compatible only, so
               old + new run together during a rolling deploy).
            4. Roll out the API first (health-gated by GET /health), then the
               static front-ends (CMS/viewer) behind the CDN.
            5. NOTE: the publish job is NOT run by deploy — publishing is an
               explicit admin action in the CMS, decoupled from code releases,
               so shipping code never silently rewrites the live catalogue.
            6. Roll back by re-pointing the deployment to the previous image tag;
               the catalogue itself rolls back independently via a prior
               publish run's versioned snapshot (catalog/runs/<id>.json).

          Secrets (DB URL, R2 keys, tokens) are injected at deploy time from the
          platform's secret store / GitHub Environment secrets — never baked into
          an image or committed. See README "Secrets in production".
          PLAN
